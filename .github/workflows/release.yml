name: Release
# Push a tag like v0.1.1 to build and publish a release Foundry/Forge can install.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Stamp version and download URL into system.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e '
            const fs = require("fs");
            const [version, tag, repo] = process.argv.slice(1);
            const p = "public/system.json";
            const m = JSON.parse(fs.readFileSync(p, "utf8"));
            m.version = version;
            m.manifest = `https://github.com/${repo}/releases/latest/download/system.json`;
            m.download = `https://github.com/${repo}/releases/download/${tag}/gloomfoundry.zip`;
            fs.writeFileSync(p, JSON.stringify(m, null, 2) + "\n");
          ' "$VERSION" "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"

      - run: npm run build

      - name: Package
        run: |
          cd dist
          zip -r ../gloomfoundry.zip . -x "*.map"
          cp system.json ../system.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" gloomfoundry.zip system.json --title "$GITHUB_REF_NAME" --generate-notes
